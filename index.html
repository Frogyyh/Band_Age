<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Band-Age — 음악으로 연주하고 치유하는 가상 밴드 무대">
    <title>Band-Age — We Play. We Heal.</title>
    <link rel="icon" href="/BandAge.ico" sizes="any">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/landing.css">
  </head>
  <body>
    <main class="landing">
      <video class="landing-video" autoplay muted loop playsinline preload="auto" poster="/BandAgelogo.png">
        <source src="/bandagevideo.mp4" type="video/mp4">
      </video>
      <div class="landing-shade" aria-hidden="true"></div>
      <header class="landing-header">
        <span>BAND-AGE</span>
        <span>VIRTUAL PERFORMANCE SYSTEM</span>
      </header>
      <section class="landing-hero">
        <img src="/bandagelogo_nobackground.png" alt="Band-Age">
      </section>
      <button id="enterButton" class="enter-button" type="button">
        <span>Go Play. Get Healed</span>
        <i aria-hidden="true">↗</i>
      </button>
    </main>

    <div id="authDialog" class="auth-dialog" aria-hidden="true">
      <div class="auth-card" role="dialog" aria-modal="true" aria-labelledby="authTitle">
        <button id="authClose" class="auth-close" type="button" aria-label="닫기">×</button>
        <p class="auth-kicker">WELCOME TO BAND-AGE</p>
        <h1 id="authTitle">다시 만나 반가워요.</h1>
        <p id="authDescription">로그인하고 나만의 밴드 무대로 이동하세요.</p>
        <div class="auth-tabs" role="tablist">
          <button class="auth-tab is-active" data-mode="login" type="button">로그인</button>
          <button class="auth-tab" data-mode="signup" type="button">회원가입</button>
        </div>
        <form id="authForm">
          <label>아이디<input id="authUsername" autocomplete="username" required></label>
          <label id="nicknameField" hidden>닉네임<input id="authNickname" autocomplete="nickname"></label>
          <label>비밀번호<input id="authPassword" type="password" autocomplete="current-password" required></label>
          <p id="authError" class="auth-error" role="alert" hidden></p>
          <button id="authSubmit" class="auth-submit" type="submit">로그인하고 시작하기</button>
        </form>
        <button id="kakaoButton" class="kakao-button" type="button">카카오로 시작하기</button>
      </div>
    </div>
    <script type="module" src="/landing.js"></script>
  </body>
</html>
