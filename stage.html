<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="원형 무대 위 6인 밴드 3D 공연" />
    <title>Band Age — Virtual Stage</title>
  </head>
  <body>
    <main id="scene" aria-label="6인 밴드의 3D 원형 무대"></main>
    <nav id="maskControls" aria-label="Player masks">
      <button class="mask-button" data-mask="frog" type="button" aria-pressed="false">FROG</button>
      <button class="mask-button" data-mask="sj" type="button" aria-pressed="false">SJ</button>
      <button class="mask-button" data-mask="kgu" type="button" aria-pressed="false">KGU</button>
      <button class="mask-button" data-mask="marshmello" type="button" aria-pressed="false">MARSHMELLO</button>
    </nav>
    <aside id="artistPanel" aria-hidden="true">
      <span>SELECTED ARTIST</span>
      <h1 id="artistName">SINGER</h1>
      <p>LIVE PERFORMANCE VIEW</p>
      <button id="artistMotionButton" type="button">PAUSE MOTION</button>
      <button id="artistExitButton" type="button">← EXIT</button>
    </aside>
    <script type="module" src="/src/stage.js"></script>
  </body>
</html>
