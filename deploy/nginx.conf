# Band-Age nginx 설정 (EC2에 /etc/nginx/sites-available/band-age 로 복사해서 사용)
#
# 역할:
#  - dist/ 아래 빌드된 정적 파일(랜딩/로비/무대/뷰어)을 직접 서빙
#  - /api/*  → Node 백엔드(4000)로 프록시
#  - /uploads/* → Node 백엔드가 서빙하는 업로드 파일로 프록시
#  - /separate, /jobs, /stems, /session → Python 음원분리 서버(8000)로 프록시
#
# 도메인 없이 IP로만 테스트할 거면 server_name을 EC2 퍼블릭 IP나 _ (아무거나 허용)로 둬도 됨.

server {
    listen 80;
    server_name _;

    root /home/ubuntu/band-age/dist;
    index index.html;

    # 기본값(1M)은 곡 업로드(최대 25MB, server/config/upload.js 기준)를 막으므로 넉넉히 둔다.
    client_max_body_size 30M;

    # 빌드된 정적 파일 (js/css/이미지/영상 등)
    location / {
        try_files $uri $uri/ =404;
    }

    # Node 백엔드 API
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Node 백엔드가 서빙하는 업로드 파일 (아바타/곡 등)
    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
    }

    # Python 음원분리 서버 — 업로드/처리 시간이 길 수 있어 타임아웃을 넉넉히 둔다.
    location ~ ^/(separate|jobs|stems|session) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 100M;
    }
}
